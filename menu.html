<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menu | Mamakanana's Shisanyama</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7faf8;
            color: #222;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: white;
            border-bottom: 4px solid #08783e;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav {
            max-width: 1200px;
            min-height: 90px;
            margin: auto;
            padding: 10px 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 50%;
        }

        .logo-text h1 {
            color: #08783e;
            font-size: 21px;
        }

        .logo-text span {
            color: #e51c23;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #173b2a;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #e51c23;
        }

        /* =========================
           CART
        ========================= */

        .cart-button {
            border: none;
            background: #08783e;
            color: white;

            padding: 12px 18px;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-button:hover {
            background: #e51c23;
        }

        #cartCount {
            background: #e51c23;
            padding: 3px 7px;
            border-radius: 50%;
            margin-left: 5px;
        }

        /* =========================
           MOBILE BUTTON
        ========================= */

        .mobile-button {
            display: none;
            font-size: 28px;
            color: #08783e;
            cursor: pointer;
        }

        /* =========================
           HERO
        ========================= */

        .menu-header {
            background:
                linear-gradient(
                    rgba(0, 80, 40, 0.88),
                    rgba(0, 80, 40, 0.88)
                ),
                url("logo.jpg");

            background-size: cover;
            background-position: center;

            color: white;
            text-align: center;

            padding: 90px 20px;
        }

        .menu-header h2 {
            font-size: clamp(42px, 7vw, 65px);
            margin-bottom: 15px;
        }

        .menu-header h2 span {
            color: #ff3333;
        }

        .menu-header p {
            font-size: 19px;
        }

        /* =========================
           MENU
        ========================= */

        .menu-container {
            max-width: 1150px;
            margin: auto;
            padding: 70px 20px;
        }

        .category {
            margin-bottom: 70px;
        }

        .category-title {
            text-align: center;
            color: #08783e;
            font-size: 34px;
            margin-bottom: 12px;
        }

        .red-line {
            width: 65px;
            height: 5px;
            background: #e51c23;
            margin: 0 auto 35px;
            border-radius: 5px;
        }

        /* =========================
           FOOD GRID
        ========================= */

        .food-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        /* =========================
           FOOD CARD
        ========================= */

        .food-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

            transition: 0.3s;

            border-bottom: 4px solid #08783e;
        }

        .food-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.13);
        }

        .food-image {
            height: 190px;

            background:
                linear-gradient(
                    135deg,
                    #08783e,
                    #0b9a52
                );

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .food-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .food-emoji {
            font-size: 65px;
        }

        .food-content {
            padding: 22px;
        }

        .food-content h3 {
            color: #173b2a;
            font-size: 21px;
            margin-bottom: 8px;
        }

        .food-description {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
        }

        .food-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }

        .price {
            color: #e51c23;
            font-size: 20px;
            font-weight: bold;
        }

        .add-cart {
            border: none;
            background: #08783e;
            color: white;

            padding: 11px 15px;
            border-radius: 6px;

            cursor: pointer;
            font-weight: bold;
        }

        .add-cart:hover {
            background: #e51c23;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 80px 20px;

            color: #08783e;
            font-size: 20px;
        }

        .error-message {
            text-align: center;
            padding: 60px 20px;

            color: #e51c23;
            font-weight: bold;
        }

        /* =========================
           CART OVERLAY
        ========================= */

        .cart-overlay {
            display: none;

            position: fixed;
            inset: 0;

            background: rgba(0,0,0,0.55);

            z-index: 2000;
        }

        .cart-overlay.active {
            display: block;
        }

        /* =========================
           CART SIDEBAR
        ========================= */

        .cart-sidebar {
            position: fixed;

            top: 0;
            right: -450px;

            width: 430px;
            max-width: 95%;

            height: 100vh;

            background: white;

            z-index: 3000;

            display: flex;
            flex-direction: column;

            transition: 0.35s;

            box-shadow: -5px 0 20px rgba(0,0,0,0.15);
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header {
            background: #08783e;
            color: white;

            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-header h2 {
            font-size: 22px;
        }

        .close-cart {
            background: none;
            border: none;

            color: white;
            font-size: 28px;

            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .empty-cart {
            text-align: center;
            color: #777;
            margin-top: 80px;
            font-size: 18px;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .cart-item-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .cart-item h3 {
            color: #173b2a;
            font-size: 16px;
        }

        .remove-item {
            border: none;
            background: none;

            color: #e51c23;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 12px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            width: 28px;
            height: 28px;

            border: none;
            background: #08783e;
            color: white;

            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-price {
            color: #e51c23;
            font-weight: bold;
        }

        /* =========================
           CART FOOTER
        ========================= */

        .cart-footer {
            padding: 20px;
            border-top: 1px solid #ddd;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;

            font-size: 20px;
            font-weight: bold;

            margin-bottom: 15px;
        }

        #cartTotal {
            color: #e51c23;
        }

        .checkout-button {
            width: 100%;

            border: none;
            background: #08783e;
            color: white;

            padding: 15px;
            border-radius: 7px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .checkout-button:hover {
            background: #e51c23;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #062f1b;
            color: white;

            text-align: center;
            padding: 30px;
        }

        footer span {
            color: #e51c23;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .food-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .nav-links {
                display: none;

                position: absolute;

                top: 90px;
                left: 0;

                width: 100%;

                background: white;

                flex-direction: column;

                gap: 0;

                text-align: center;

                border-bottom: 3px solid #08783e;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                display: block;
                padding: 16px;
            }

            .mobile-button {
                display: block;
            }

            .food-grid {
                grid-template-columns: 1fr;
            }

            .cart-sidebar {
                width: 100%;
            }

            .logo img {
                width: 55px;
                height: 55px;
            }

            .logo-text h1 {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <nav>

        <div class="logo">

            <img
                src="logo.jpg"
                alt="Mamakanana's Shisanyama Logo"
            >

            <div class="logo-text">

                <h1>
                    Mamakanana's
                </h1>

                <span>
                    SHISANYAMA
                </span>

            </div>

        </div>


        <div
            class="mobile-button"
            id="mobileButton"
        >
            ☰
        </div>


        <ul
            class="nav-links"
            id="navLinks"
        >

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="menu.html">
                    Menu
                </a>
            </li>

            <li>
                <a href="index.html#about">
                    About Us
                </a>
            </li>

            <li>

                <button
                    class="cart-button"
                    id="openCart"
                >

                    🛒 Cart

                    <span id="cartCount">
                        0
                    </span>

                </button>

            </li>

        </ul>

    </nav>

</header>


<!-- =========================
     HERO
========================= -->

<section class="menu-header">

    <h2>
        Our <span>Menu</span>
    </h2>

    <p>
        Freshly prepared. Perfectly grilled.
    </p>

</section>


<!-- =========================
     MENU CONTAINER
========================= -->

<main
    class="menu-container"
    id="menuContainer"
>

    <div class="loading">
        Loading our menu...
    </div>

</main>


<!-- =========================
     CART OVERLAY
========================= -->

<div
    class="cart-overlay"
    id="cartOverlay"
>
</div>


<!-- =========================
     CART SIDEBAR
========================= -->

<aside
    class="cart-sidebar"
    id="cartSidebar"
>

    <div class="cart-header">

        <h2>
            Your Cart 🛒
        </h2>

        <button
            class="close-cart"
            id="closeCart"
        >
            ×
        </button>

    </div>


    <div
        class="cart-items"
        id="cartItems"
    >

        <p class="empty-cart">
            Your cart is empty.
        </p>

    </div>


    <div class="cart-footer">

        <div class="cart-total">

            <span>
                Total
            </span>

            <span id="cartTotal">
                R0.00
            </span>

        </div>


        <button
            class="checkout-button"
            id="checkoutButton"
        >
            PROCEED TO CHECKOUT
        </button>

    </div>

</aside>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 Mamakanana's Shisanyama
    </p>

    <p>
        <span>Good Food</span>
        • Great Company • Authentic Flavour
    </p>

</footer>


<script src="menu.js"></script>

</body>

</html>
